name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # 版本号来自仓库根目录的 VERSION 文件；构建号是运行序号
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Release 说明需要上一个 tag 以来的全部提交
          fetch-depth: 0

      - name: Read version
        run: |
          APP_VERSION=$(tr -d '[:space:]' < VERSION)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # 这个版本还没发过 → 正式版；发过了 → 带构建号的预览版
          if git rev-parse -q --verify "refs/tags/v$APP_VERSION" >/dev/null; then
            echo "RELEASE_TAG=v$APP_VERSION-build.$BUILD_NUMBER" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=prerelease" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=release" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project iPAN.xcodeproj \
            -scheme iPAN \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build 2>&1 | tee xcodebuild.log | { grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true; }
          # 构建失败时不能只看 .app 目录在不在（资源会先拷进去），必须确认可执行文件真的生成了
          test -x build/Build/Products/Release-iphoneos/iPAN.app/iPAN

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iPAN.app Payload/
          test -x Payload/iPAN.app/iPAN
          # 与 Xcode 导出 IPA 一样用 ditto 打包（文件名为 UTF-8 字节，中文模板名可正常安装）
          ditto -c -k --norsrc --keepParent Payload iPAN-unsigned.ipa
          cp iPAN-unsigned.ipa "iPAN-${RELEASE_TAG#v}-unsigned.ipa"
          ls -lh iPAN-*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPAN-unsigned-ipa
          path: iPAN-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      # 每次推送都发布：新版本号发正式版（Latest），同一版本号的后续推送发带构建号的预览版
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)
          RANGE=${PREV_TAG:+$PREV_TAG..}HEAD
          {
            if [ "$RELEASE_KIND" = "release" ] && [ -f "release-notes/$APP_VERSION.md" ]; then
              cat "release-notes/$APP_VERSION.md"
              echo
            else
              echo "## iPAN ${APP_VERSION}（构建 ${BUILD_NUMBER}）"
              echo
            fi
            echo "- 分支：\`${GITHUB_REF_NAME}\` · 提交：${GITHUB_SHA}"
            echo "- 构建：Xcode $(xcodebuild -version | head -n 1 | awk '{print $2}')，未签名，安装前需自行签名"
            echo
            echo "### 提交记录${PREV_TAG:+（自 ${PREV_TAG} 起）}"
            echo
            git log --no-merges --format='- %s' "$RANGE"
          } > release-notes.md
          cat release-notes.md
          FLAGS=(--latest)
          TITLE="iPAN $APP_VERSION"
          if [ "$RELEASE_KIND" = "prerelease" ]; then
            FLAGS=(--prerelease)
            TITLE="iPAN ${APP_VERSION}（构建 ${BUILD_NUMBER}）"
          fi
          gh release create "$RELEASE_TAG" "iPAN-${RELEASE_TAG#v}-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"
