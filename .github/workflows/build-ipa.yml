name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project iPAN.xcodeproj \
            -scheme iPAN \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/iPAN.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iPAN.app Payload/
          # 与 Xcode 导出 IPA 一样用 ditto 打包（文件名为 UTF-8 字节，中文模板名可正常安装）
          ditto -c -k --norsrc --keepParent Payload iPAN-unsigned.ipa
          ls -lh iPAN-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPAN-unsigned-ipa
          path: iPAN-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
